<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mathematics for Machine Learning and Deep Learning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A comprehensive, static, bottom-up course that takes a working programmer from basic mathematical notation to the mathematics behind GPT-2, backpropagation, AdamW, Muon and fine-tuning — every concept connected to what PyTorch actually does.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    :root { --theme-color: #6b46c1; }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.1em; }
    .markdown-section { max-width: 900px; }
    /* Callout boxes used throughout the lessons */
    .callout { border-left: 4px solid var(--theme-color); background: #f6f3fc;
      padding: 0.8em 1em; margin: 1.2em 0; border-radius: 0 6px 6px 0; }
    .callout.pt { border-left-color: #ee4c2c; background: #fdf0ec; }
    .callout.warn { border-left-color: #e0a800; background: #fdf9e7; }
    .callout.key { border-left-color: #1f7a5a; background: #eef7f3; }
    .callout p:first-child { margin-top: 0; }
    .callout p:last-child { margin-bottom: 0; }
    .prereq { font-size: 0.92em; background: #f4f4f8; border: 1px solid #e2e2ee;
      border-radius: 8px; padding: 0.6em 1em; margin-bottom: 1.5em; }
    .prereq p { margin: 0.3em 0; }
    .katex { font-size: 1.05em; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.3em 0; }
    table { display: table; width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Math for ML',
      repo: 'https://github.com/tal-giladi/math-for-machine-learning-course',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Search the course...',
        noData: 'No results.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      count: { countable: true },
      katex: {
        displayMode: false,
        throwOnError: false
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <!-- KaTeX must load before the docsify-katex plugin -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
